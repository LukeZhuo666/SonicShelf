<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f0e7"><title>音架 · 私人音乐影像档案</title>
<style>
:root{--paper:#f4f0e7;--ink:#20231f;--muted:#77796f;--line:#d7d2c6;--green:#28483b;--lime:#c4d85b;--orange:#d66e44}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1240px;margin:auto;padding:0 32px}.top{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:21px;font-weight:850;letter-spacing:-.06em}.brand small{display:block;font-size:10px;letter-spacing:.2em;color:var(--muted);font-weight:500}.topright{display:flex;align-items:center;gap:18px;color:var(--muted);font-size:12px}.hero{padding:65px 0 45px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:30px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.19em;color:var(--green);font-weight:800}.hero h1{font-size:clamp(42px,6vw,76px);line-height:1.05;letter-spacing:-.07em;margin:13px 0}.hero p{color:var(--muted);margin:0}.hero-mark{width:162px;height:162px;border-radius:50%;background:var(--green);color:var(--lime);display:grid;place-items:center;font-size:70px;box-shadow:14px 14px 0 var(--lime)}.toolbar{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:24px}.toolbar input{flex:1;min-width:80px;background:none;border:0;outline:0}.pill,.button{border:1px solid var(--line);border-radius:99px;padding:9px 15px;background:transparent;color:var(--ink)}.button.dark{background:var(--green);border-color:var(--green);color:#fff}.button:hover,.pill:hover{transform:translateY(-1px)}.filters{display:flex;gap:8px;overflow:auto;margin:0 0 24px}.filter{white-space:nowrap;border:1px solid transparent;border-radius:99px;padding:8px 14px;background:transparent;color:var(--muted)}.filter.active{background:var(--green);color:white}.layout{display:grid;grid-template-columns:1.5fr .7fr;gap:25px;align-items:start}.records{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.record{border:1px solid var(--line);background:#fffdf7;padding:12px;min-width:0}.cover{aspect-ratio:1.18;background:var(--green);display:grid;place-items:center;color:var(--lime);font-size:51px;position:relative;overflow:hidden}.cover:before,.cover:after{content:"";position:absolute;width:80%;aspect-ratio:1;border:1px solid #ffffff60;border-radius:50%}.cover:after{width:55%}.cover span{z-index:1}.record h3{font-size:15px;margin:12px 0 3px}.record p{margin:0;color:var(--muted);font-size:12px}.record .row{display:flex;justify-content:space-between;align-items:center;margin-top:13px}.tag{font-size:10px;color:var(--green);background:#e7eadb;padding:4px 8px;border-radius:99px}.iconbtn{border:0;background:none;font-size:18px;color:#98998e}.iconbtn.on{color:var(--orange)}.side{background:#e9e4d8;padding:22px;position:sticky;top:18px}.side h2{margin:0 0 3px;font-size:23px;letter-spacing:-.04em}.side .hint{font-size:12px;color:var(--muted);margin:0 0 18px}.player{aspect-ratio:16/9;background:var(--green);display:grid;place-items:center;color:var(--lime);font-size:42px;margin:15px 0}.player iframe{width:100%;height:100%;border:0}.side input,.side select{width:100%;padding:10px;border:1px solid var(--line);background:#fffdf7;margin:5px 0 11px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{width:100%}.empty{grid-column:1/-1;padding:65px 10px;text-align:center;color:var(--muted);border:1px dashed var(--line)}.foot{padding:35px 0;color:var(--muted);font-size:11px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--green);color:white;padding:10px 17px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:static}.records{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.shell{padding:0 17px}.top{height:68px}.topright{gap:9px}.topright span{display:none}.hero{padding:48px 0 32px}.hero-mark{width:82px;height:82px;font-size:38px;box-shadow:7px 7px 0 var(--lime)}.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:100%;padding:8px}.records{grid-template-columns:1fr 1fr}.record{padding:8px}.record h3{font-size:13px}}
</style></head><body><div class="shell"><header class="top"><div class="brand">音架 <small>SONIC SHELF · MUSIC VIDEO ARCHIVE</small></div><div class="topright"><span id="count">0 条收藏</span><button class="button" id="export">导出档案</button><label class="button" for="importFile">导入档案</label><input id="importFile" type="file" accept="application/json" hidden></div></header>
<section class="hero"><div><div class="eyebrow">听觉记忆 · 个人策展</div><h1>把喜欢的声音，<br>安放在自己的唱片架。</h1><p>收集现场、翻唱与音乐影像；按风格整理，随时找回。</p></div><div class="hero-mark">♫</div></section>
<div class="toolbar"><input id="search" placeholder="搜索歌曲、艺人或备注…"><select class="pill" id="sort"><option value="new">最近加入</option><option value="title">按名称排序</option></select><button class="button dark" id="addTop">＋ 收藏一首</button></div>
<nav class="filters" id="filters"></nav><div class="layout"><main><div class="records" id="records"></div></main><aside class="side"><h2 id="playingTitle">正在听什么？</h2><p class="hint" id="playingSub">点选一张唱片，或收藏一段新的音乐影像。</p><div class="player" id="player">♫</div><form id="form"><label>作品名称<input required name="title" placeholder="例如：Tiny Desk Concert"></label><label>艺人 / 来源<input name="artist" placeholder="例如：Anderson .Paak"></label><label>视频链接<input name="url" type="url" placeholder="YouTube 或 Bilibili 链接"></label><div class="formgrid"><label>风格<select name="genre"><option>R&B</option><option>爵士</option><option>嘻哈</option><option>电子</option><option>民谣</option><option>电影配乐</option><option>其他</option></select></label><label>听歌场景<select name="mood"><option>专注</option><option>通勤</option><option>夜晚</option><option>放松</option><option>现场</option></select></label></div><button class="button dark full">加入我的唱片架</button></form></aside></div><footer class="foot">音架 · 数据只保存在当前浏览器，可随时导出备份。</footer></div><div class="toast" id="toast"></div>
<script>
const seed=[{id:'s1',title:'Tiny Desk Concert',artist:'Anderson .Paak',genre:'R&B',mood:'现场',url:'',fav:true,date:3},{id:'s2',title:'Blue in Green',artist:'Miles Davis',genre:'爵士',mood:'夜晚',url:'',fav:false,date:2},{id:'s3',title:'Night Drive',artist:'Chromatics',genre:'电子',mood:'通勤',url:'',fav:false,date:1}];let items=JSON.parse(localStorage.sonicShelf||'null')||seed;let active='全部',playing=null;const $=s=>document.querySelector(s);function save(){localStorage.sonicShelf=JSON.stringify(items);render()}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1800)}function categories(){return ['全部',...new Set(items.map(x=>x.genre)),'喜欢']}function render(){let fs=categories();$('#filters').innerHTML=fs.map(f=>`<button class="filter ${active===f?'active':''}" data-f="${f}">${f}</button>`).join('');document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{active=b.dataset.f;render()});let q=$('#search').value.toLowerCase();let arr=items.filter(x=>(active==='全部'||(active==='喜欢'?x.fav:x.genre===active))&&`${x.title} ${x.artist} ${x.genre}`.toLowerCase().includes(q));if($('#sort').value==='title')arr.sort((a,b)=>a.title.localeCompare(b.title));else arr.sort((a,b)=>b.date-a.date);$('#count').textContent=`${items.length} 条收藏`;$('#records').innerHTML=arr.length?arr.map((x,i)=>`<article class="record"><button class="cover" data-play="${x.id}" aria-label="播放 ${x.title}"><span>${['◉','♫','◌','♬','◎'][i%5]}</span></button><h3>${esc(x.title)}</h3><p>${esc(x.artist||'未知艺人')} · ${esc(x.mood)}</p><div class="row"><span class="tag">${esc(x.genre)}</span><span><button class="iconbtn ${x.fav?'on':''}" data-fav="${x.id}">♥</button><button class="iconbtn" data-del="${x.id}">×</button></span></div></article>`).join(''):'<div class="empty">这里还没有这类收藏。加一首喜欢的音乐，开始整理你的唱片架。</div>';document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>play(b.dataset.play));document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{let x=items.find(x=>x.id===b.dataset.fav);x.fav=!x.fav;save()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{items=items.filter(x=>x.id!==b.dataset.del);save()})}function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function embed(url){try{let u=new URL(url);if(u.hostname.includes('youtu')){let id=u.searchParams.get('v')||u.pathname.split('/').pop();return `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}`}if(u.hostname.includes('bilibili.com')){let m=url.match(/BV[\w]+/);return m?`https://player.bilibili.com/player.html?bvid=${m[0]}&autoplay=0`:''}}catch{}return ''}function play(id){let x=items.find(x=>x.id===id);if(!x)return;playing=x;$('#playingTitle').textContent=x.title;$('#playingSub').textContent=`${x.artist||'未知艺人'} · ${x.genre} / ${x.mood}`;let src=embed(x.url||'');$('#player').innerHTML=src?`<iframe src="${src}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="${esc(x.title)}"></iframe>`:'♫'}$('#form').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));items.unshift({id:crypto.randomUUID(),...d,fav:false,date:Date.now()});e.target.reset();active='全部';save();toast('已放进唱片架')};$('#addTop').onclick=()=>{$('input[name=title]').focus();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};$('#search').oninput=render;$('#sort').onchange=render;$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(items,null,2)],{type:'application/json'}));a.download='sonic-shelf.json';a.click();URL.revokeObjectURL(a.href)};$('#importFile').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(Array.isArray(v)){items=v;save();toast('档案已导入')}}catch{toast('文件格式不正确')}};render();</script></body></html>
